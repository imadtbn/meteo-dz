name: Pull request freshness guard

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited

permissions:
  contents: read

jobs:
  require-current-main:
    name: Require PR branch to include current main
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request head with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Reject branches based on an outdated main
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "${BASE_SHA}"
          fi

          if ! git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            echo "::error::Could not resolve the pull request head commit."
            exit 1
          fi

          if git merge-base --is-ancestor "${BASE_SHA}" "${HEAD_SHA}"; then
            echo "The pull request includes the current main commit."
            exit 0
          fi

          MERGE_BASE="$(git merge-base "${BASE_SHA}" "${HEAD_SHA}" || true)"
          echo "::error::This pull request is based on an outdated main branch."
          echo "Current main: ${BASE_SHA}"
          echo "PR head:      ${HEAD_SHA}"
          echo "Merge base:   ${MERGE_BASE:-none}"
          echo "Update the PR branch from the latest main (merge or rebase), resolve conflicts, push, and wait for checks again."
          exit 1
